name: CI

on:
  workflow_dispatch:

jobs:
  format_client:
    name: Format client
    runs-on: monkci-ubuntu-24.04-4

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Always install the version specified in yarn.lock
      - name: Install prettier
        run: |
          prettier_version=$(awk "/^prettier/{getline; print}" yarn.lock | cut -d "\"" -f 2)
          npm i -g prettier@$prettier_version

      - name: Check format
        run: yarn check-format

      - name: Debug rust/env
        run: |
          echo "PATH=$PATH"
          echo "--- /etc/environment ---"; cat /etc/environment
          echo "--- .path ---"; cat /home/runner/actions-runner/.path 2>/dev/null || echo "no .path"
          echo "--- .env ---"; cat /home/runner/actions-runner/.env 2>/dev/null || echo "no .env"
          ls -la /usr/share/rust/.cargo/bin 2>/dev/null || echo "rust bin not there"
          command -v rustup || true

  format_server:
    name: Format server
    runs-on: monkci-ubuntu-24.04-4

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Add nightly rustfmt
        run: rustup component add rustfmt

      - name: Check format
        run: cargo fmt --check

  format_wasm:
    name: Format WASM
    runs-on: monkci-ubuntu-24.04-4

    defaults:
      run:
        working-directory: wasm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check format
        run: cargo fmt --check

  clippy_server:
    name: Clippy Server
    runs-on: monkci-ubuntu-24.04-4

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check clippy warnings
        run: cargo clippy --all-targets -- -D warnings

  clippy_wasm:
    name: Clippy WASM
    runs-on: monkci-ubuntu-24.04-4

    defaults:
      run:
        working-directory: wasm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check clippy warnings
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build
    runs-on: monkci-ubuntu-24.04-4

    needs:
      - format_client
      - format_server
      - format_wasm
      - clippy_server
      - clippy_wasm

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync rust-toolchain
        run: rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup
        run: yarn setup

      # This confirms that there are no changes after setup script runs
      - name: Check git status
        run: git status --porcelain | wc -l | grep -q -w "0"

      - name: Build
        run: yarn build
